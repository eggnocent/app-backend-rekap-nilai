services:
  app:
    build:
      context: .
      network: host
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: nilaiku
      DB_USER: nilaiku
      DB_PASSWORD: nilaiku
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
    depends_on:
      database:
        condition: service_healthy
  database:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: nilaiku
      POSTGRES_USER: nilaiku
      POSTGRES_PASSWORD: nilaiku
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data.sql:/docker-entrypoint-initdb.d/data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nilaiku -d nilaiku"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
